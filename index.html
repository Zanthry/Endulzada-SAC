<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amor y Amistad - Endulzada</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fcf8f5 30%, #eaddd7 100%);
    color: #4a3525; 
    max-width: 560px;
    margin: 40px auto;
    padding: 24px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(164, 74, 63, 0.1);
    border: 3px solid #d47a61;
  }
  h1 {
    color: #a44a3f; 
    text-align: center;
    font-family: 'Pacifico', cursive, serif;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .mensaje-amistad {
    color: #6b4c3a;
    text-align: center;
    margin-bottom: 28px;
    font-size: 1.10em;
    font-weight: 500;
  }
  label {
    margin-top: 15px;
    display: block;
    font-weight: 600;
    color: #8e4938;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 15px;
    margin-top: 8px;
    border: 2px solid #dcb5a7; 
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
    background-color: #ffffff;
  }
  input[type="text"]:focus {
    border-color: #d47a61;
    outline: none;
  }
  button {
    margin-top: 20px;
    background-color: #d47a61; 
    color: white;
    border: none;
    padding: 14px 20px;
    font-size: 17px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-weight: 700;
    transition: background-color 0.3s ease;
    box-shadow: 0 2px 6px rgba(212, 122, 97, 0.4);
  }
  button:hover:enabled {
    background-color: #ba654f; 
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  #resultado {
    margin-top: 25px;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    border: 2px solid #ebd4cc;
    font-size: 18px;
    min-height: 70px;
    text-align: center;
  }
  #resultado p {
    margin: 10px 0;
  }
  #mensaje-error {
    color: #a44a3f;
    font-weight: 600;
  }
  .amistad-emoji {
    font-size: 2.3em;
    display: block;
    text-align: center;
    margin-bottom: 18px;
  }
</style>
<link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
</head>

  <button type="button" id="buscarBtn" onclick="buscarAsignado()" disabled>Buscar</button>

function activarBusqueda(activar) {
  document.getElementById('cedulaInput').disabled = !activar;
  document.getElementById('buscarBtn').disabled = !activar;
}

function buscarAsignado() {
  const cedula = document.getElementById('cedulaInput').value.trim();
  const resultadoDiv = document.getElementById('resultado');
  
  if (!cedula) {
    resultadoDiv.innerHTML = '<p id="mensaje-error">Por favor, ingresa tu cédula.</p>';
    return;
  }

  const encontrado = datos.find(item => item.cedula === cedula);
  
  if (encontrado) {
    resultadoDiv.innerHTML = `
      <p>Tu asignado es: <strong style="color:#a44a3f;">${encontrado.asignadoNombre}</strong></p>
      <p>Dulce que debes llevar: <strong style="color:#d47a61;">${encontrado.dulce}</strong></p>
      <div style="text-align:center;font-size:2em;margin-top:14px;">☕🍪</div>
    `;
  } else {
    resultadoDiv.innerHTML = '<p id="mensaje-error">Cédula no encontrada. Por favor verifica e intenta de nuevo.</p>';
  }
}

// Inicializamos la aplicación
document.getElementById('resultado').innerHTML = '¡Datos cargados! Ya puedes buscar tu endulzada.';
activarBusqueda(true);
</script>
</body>
</html>
