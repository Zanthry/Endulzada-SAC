<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amor y Amistad - Endulzada</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    /* Fondo con tonos rosados y cálidos */
    background: linear-gradient(135deg, #fff0f3 30%, #ffc2d1 100%);
    color: #222;
    max-width: 560px;
    margin: 40px auto;
    padding: 24px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(201, 24, 74, 0.15);
    /* Borde magenta/rosado oscuro */
    border: 3px solid #ff4d6d;
  }
  h1 {
    color: #c9184a;
    text-align: center;
    font-family: 'Pacifico', cursive, serif;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .mensaje-amor {
    color: #800f2f;
    text-align: center;
    margin-bottom: 28px;
    font-size: 1.10em;
    font-weight: 500;
  }
  label {
    margin-top: 15px;
    display: block;
    font-weight: 600;
    color: #a4133c;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 15px;
    margin-top: 8px;
    border: 2px solid #ff8fa3;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
    background-color: #fafafa;
  }
  input[type="text"]:focus {
    border-color: #ff4d6d;
    outline: none;
  }
  button {
    margin-top: 20px;
    background-color: #ff4d6d;
    color: white;
    border: none;
    padding: 14px 20px;
    font-size: 17px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-weight: 700;
    transition: background-color 0.3s ease;
    box-shadow: 0 2px 6px rgba(255, 77, 109, 0.4);
  }
  button:hover:enabled {
    background-color: #c9184a;
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  #resultado {
    margin-top: 25px;
    background-color: #fffbfa;
    padding: 20px;
    border-radius: 10px;
    border: 2px solid #ffb3c6;
    font-size: 18px;
    min-height: 70px;
    text-align: center;
  }
  #resultado p {
    margin: 10px 0;
  }
  #mensaje-error {
    color: #c9184a;
    font-weight: 600;
  }
  .amor-emoji {
    font-size: 2.3em;
    display: block;
    text-align: center;
    margin-bottom: 18px;
  }
</style>
<link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
  <div class="amor-emoji">💖🍬💌</div>
  <h1>Amor y Amistad</h1>
  <div class="mensaje-amor">
    Ingresa tu número de celular y descubre a quién debes endulzar para celebrar con el equipo.
  </div>

  <label for="cedulaInput">Ingresa tu número de celular</label>
  <input type="text" id="cedulaInput" placeholder="Ejemplo: 3102345678" autocomplete="off" disabled />

  <button type="button" id="buscarBtn" onclick="buscarAsignado()" disabled>Buscar</button>
  <div id="resultado">Cargando datos de Amor y Amistad, por favor espera...</div>

<script>
let datos = [];

function activarBusqueda(activar) {
  document.getElementById('cedulaInput').disabled = !activar;
  document.getElementById('buscarBtn').disabled = !activar;
}

function buscarAsignado() {
  const cedula = document.getElementById('cedulaInput').value.trim();
  const resultadoDiv = document.getElementById('resultado');
  
  if (!cedula) {
    resultadoDiv.innerHTML = '<p id="mensaje-error">Por favor, ingresa tu número de celular.</p>';
    return;
  }

  // Se mantiene "cedula" aquí para que tu JSON siga funcionando sin problemas
  const encontrado = datos.find(item => item.cedula === cedula);
  
  if (encontrado) {
    resultadoDiv.innerHTML = `
      <p>Tu amigo secreto es: <strong style="color:#c9184a;">${encontrado.asignadoNombre}</strong></p>
      <p>Debes llevarle: <strong style="color:#a4133c;">${encontrado.dulce}</strong></p>
      <div style="text-align:center;font-size:2em;margin-top:14px;">💝🍫</div>
    `;
  } else {
    resultadoDiv.innerHTML = '<p id="mensaje-error">Número no encontrado. Por favor verifica e intenta de nuevo.</p>';
  }
}

// Carga el JSON externo
fetch('datos.json')
  .then(response => {
    if (!response.ok) throw new Error('No se pudo cargar el archivo JSON.');
    return response.json();
  })
  .then(jsonData => {
    datos = jsonData;
    document.getElementById('resultado').innerHTML = '¡Datos cargados! Ya puedes buscar tu endulzada.';
    activarBusqueda(true);
  })
  .catch(error => {
    document.getElementById('resultado').innerHTML = `<p id="mensaje-error">Error al cargar datos: ${error.message}</p>`;
  });
</script>
</body>
</html>
